# .hlint.yaml

# Specify additional command line arguments
- arguments: [ --threads ]

# Control which extensions/flags/modules/functions can be used
- extensions:
  - default: false
  - name:
      - ApplicativeDo
      - DeriveAnyClass
      - DeriveGeneric
      - MultiWayIf
      - NoImplicitPrelude
      - OverloadedLists
      - OverloadedStrings
      - RecordWildCards
      - TupleSections
      - TypeFamilies
  - { name: FlexibleInstances, within: [MyCabal, Oracle.Hackage] }
  - { name: CPP, within: [MyCabal] }
  - { name: GeneralizedNewtypeDeriving, within: [Oracle.Hackage, Oracle.PackageSetSpec] }

- flags:
  - { name: -fno-warn-orphans, within: [MyCabal, Oracle.Hackage, Main] }

- modules:
  # All access to the Cabal library goes through MyCabal.
  - { name: "Distribution.**", within: [MyCabal] }

  # PackageSetSpec is used only by the oracles and by UpdatePackageSet. The
  # rules of cabal2obs must access the configuration through the oracles, so
  # that Shake can track which parts of it a rule depends on.
  - { name: PackageSetSpec, within: [Oracle.PackageSetSpec, UpdatePackageSet] }

# - functions:
#   - {name: unsafePerformIO, within: []} # unsafePerformIO can only appear in no modules

# Add custom hints for this project
- error: { lhs: return, rhs: pure }

# Turn on hints that are off by default
- warn: { name: Use explicit module export list }
- group: { name: generalise, enabled: false }

# Ignore some builtin hints
# - ignore: {name: Use let}
# - ignore: {name: Use const, within: SpecialModule} # Only within certain modules

# Define some custom infix operators
# - fixity: infixr 3 ~^#^~
